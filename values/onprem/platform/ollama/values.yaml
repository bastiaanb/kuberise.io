ollama:
  ingress:
    enabled: true
    className: nginx-external
    hosts:
      - host: ollama.172.21.0.3.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - ollama.172.21.0.3.nip.io
  ollama:
    models:
      pull:
        - deepseek-r1:1.5b
        # - deepseek-r1:7b
      run:
        - deepseek-r1:1.5b
        # - deepseek-r1:7b

  persistentVolume:
    enabled: true
